<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <title>Decorative Islamic pattern border (emerald)</title>
  <defs>
    <pattern id="patEmerald" width="70" height="90" patternUnits="userSpaceOnUse">
      <path d="M0 45 C20 15 50 15 70 45 L70 90 L0 90 Z" fill="#042617" fill-opacity="0.3" stroke="#10b981" stroke-width="1.3" opacity="0.6"/>
      <path d="M0 0 C20 -30 50 -30 70 0 L70 45 L0 45 Z" fill="#042617" fill-opacity="0.3" stroke="#10b981" stroke-width="1.3" opacity="0.6"/>
      <circle cx="35" cy="45" r="7" fill="#34d399" opacity="0.5"/>
      <line x1="35" y1="15" x2="35" y2="75" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    </pattern>
    <linearGradient id="glowELeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#021a0e" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#021a0e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#021a0e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowERight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#021a0e" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#021a0e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#021a0e" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Ornate Side Border -->
  <rect x="0" y="0" width="115" height="1000" fill="url(#glowELeft)"/>
  <rect x="0" y="0" width="95" height="1000" fill="url(#patEmerald)"/>
  <line x1="95" y1="0" x2="95" y2="1000" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>
  <line x1="103" y1="0" x2="103" y2="1000" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>

  <!-- Right Ornate Side Border -->
  <rect x="885" y="0" width="115" height="1000" fill="url(#glowERight)"/>
  <rect x="905" y="0" width="95" height="1000" fill="url(#patEmerald)"/>
  <line x1="905" y1="0" x2="905" y2="1000" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>
  <line x1="897" y1="0" x2="897" y2="1000" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
</svg>