<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <pattern id="sideStrip" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.45"/>
      <polygon points="40,15 48,32 65,40 48,48 40,65 32,48 15,40 32,32" fill="#10b981" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
      <circle cx="40" cy="40" r="5" fill="#f59e0b" opacity="0.6"/>
      <line x1="0" y1="0" x2="80" y2="80" stroke="#10b981" stroke-width="0.8" opacity="0.25"/>
      <line x1="80" y1="0" x2="0" y2="80" stroke="#10b981" stroke-width="0.8" opacity="0.25"/>
    </pattern>
    <linearGradient id="glowLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04120a" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#04120a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#04120a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#04120a" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#04120a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#04120a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Ornate Side Border (0 to 110px) -->
  <rect x="0" y="0" width="110" height="1000" fill="url(#glowLeft)"/>
  <rect x="0" y="0" width="95" height="1000" fill="url(#sideStrip)"/>
  <line x1="95" y1="0" x2="95" y2="1000" stroke="#f59e0b" stroke-width="2.5" opacity="0.6"/>
  <line x1="102" y1="0" x2="102" y2="1000" stroke="#10b981" stroke-width="1.2" opacity="0.45"/>

  <!-- Right Ornate Side Border (890px to 1000px) -->
  <rect x="890" y="0" width="110" height="1000" fill="url(#glowRight)"/>
  <rect x="905" y="0" width="95" height="1000" fill="url(#sideStrip)"/>
  <line x1="905" y1="0" x2="905" y2="1000" stroke="#f59e0b" stroke-width="2.5" opacity="0.6"/>
  <line x1="898" y1="0" x2="898" y2="1000" stroke="#10b981" stroke-width="1.2" opacity="0.45"/>
</svg>