<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <title>Decorative Islamic pattern border (moroccan)</title>
  <defs>
    <pattern id="patMoroccan" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#02140b"/>
      <path d="M40 0 C55 15 70 15 80 15 L80 40 C70 40 55 40 40 40 Z" stroke="#34d399" stroke-width="1.2" opacity="0.5"/>
      <path d="M40 0 C25 15 10 15 0 15 L0 40 C10 40 25 40 40 40 Z" stroke="#34d399" stroke-width="1.2" opacity="0.5"/>
      <path d="M40 80 C55 65 70 65 80 65 L80 40 C70 40 55 40 40 40 Z" stroke="#34d399" stroke-width="1.2" opacity="0.5"/>
      <path d="M40 80 C25 65 10 65 0 65 L0 40 C10 40 25 40 40 40 Z" stroke="#34d399" stroke-width="1.2" opacity="0.5"/>
      <polygon points="40,18 62,40 40,62 18,40" stroke="#f59e0b" stroke-width="1.3" fill="#f59e0b" fill-opacity="0.15"/>
      <circle cx="40" cy="40" r="7" stroke="#fbbf24" stroke-width="1"/>
    </pattern>
    <linearGradient id="glowMLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#02140b" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#02140b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#02140b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowMRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#02140b" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#02140b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#02140b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Ornate Side Border -->
  <rect x="0" y="0" width="115" height="1000" fill="url(#glowMLeft)"/>
  <rect x="0" y="0" width="95" height="1000" fill="url(#patMoroccan)"/>
  <line x1="95" y1="0" x2="95" y2="1000" stroke="#34d399" stroke-width="2.5" opacity="0.75"/>
  <line x1="102" y1="0" x2="102" y2="1000" stroke="#f59e0b" stroke-width="1.2" opacity="0.5"/>

  <!-- Right Ornate Side Border -->
  <rect x="885" y="0" width="115" height="1000" fill="url(#glowMRight)"/>
  <rect x="905" y="0" width="95" height="1000" fill="url(#patMoroccan)"/>
  <line x1="905" y1="0" x2="905" y2="1000" stroke="#34d399" stroke-width="2.5" opacity="0.75"/>
  <line x1="898" y1="0" x2="898" y2="1000" stroke="#f59e0b" stroke-width="1.2" opacity="0.5"/>
</svg>