<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <title>Decorative Islamic pattern border (islimi)</title>
  <defs>
    <pattern id="patIslimi" width="80" height="100" patternUnits="userSpaceOnUse">
      <rect width="80" height="100" fill="#031008"/>
      <!-- S-curve vine with palmette leaves -->
      <path d="M40 0 C15 25 15 75 40 100 C65 75 65 25 40 0 Z" stroke="#34d399" stroke-width="1.3" fill="none" opacity="0.5"/>
      <path d="M40 50 C55 35 65 45 60 55 C55 65 45 55 40 50 Z" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.1"/>
      <path d="M40 50 C25 35 15 45 20 55 C25 65 35 55 40 50 Z" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.1"/>
      <circle cx="40" cy="50" r="5" fill="#fde68a" opacity="0.8"/>
      <circle cx="40" cy="0" r="4" fill="#34d399" opacity="0.6"/>
      <circle cx="40" cy="100" r="4" fill="#34d399" opacity="0.6"/>
    </pattern>
    <linearGradient id="glowIslLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#031008" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#031008" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#031008" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowIslRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#031008" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#031008" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#031008" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Ornate Side Border -->
  <rect x="0" y="0" width="115" height="1000" fill="url(#glowIslLeft)"/>
  <rect x="0" y="0" width="95" height="1000" fill="url(#patIslimi)"/>
  <line x1="95" y1="0" x2="95" y2="1000" stroke="#f59e0b" stroke-width="2.5" opacity="0.75"/>
  <line x1="102" y1="0" x2="102" y2="1000" stroke="#34d399" stroke-width="1.2" opacity="0.5"/>

  <!-- Right Ornate Side Border -->
  <rect x="885" y="0" width="115" height="1000" fill="url(#glowIslRight)"/>
  <rect x="905" y="0" width="95" height="1000" fill="url(#patIslimi)"/>
  <line x1="905" y1="0" x2="905" y2="1000" stroke="#f59e0b" stroke-width="2.5" opacity="0.75"/>
  <line x1="898" y1="0" x2="898" y2="1000" stroke="#34d399" stroke-width="1.2" opacity="0.5"/>
</svg>