<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <title>Decorative Islamic pattern border (girih)</title>
  <defs>
    <pattern id="patGirih" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#040b07"/>
      <polygon points="40,8 45,26 63,20 53,36 71,40 53,44 63,60 45,54 40,72 35,54 17,60 27,44 9,40 27,36 17,20 35,26" stroke="#fbbf24" stroke-width="1.2" fill="#fbbf24" fill-opacity="0.18" opacity="0.7"/>
      <circle cx="40" cy="40" r="14" stroke="#10b981" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="40" cy="40" r="6" fill="#f59e0b" opacity="0.8"/>
    </pattern>
    <linearGradient id="glowGiriLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040b07" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#040b07" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#040b07" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glowGiriRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#040b07" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#040b07" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#040b07" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Ornate Side Border -->
  <rect x="0" y="0" width="115" height="1000" fill="url(#glowGiriLeft)"/>
  <rect x="0" y="0" width="95" height="1000" fill="url(#patGirih)"/>
  <line x1="95" y1="0" x2="95" y2="1000" stroke="#fbbf24" stroke-width="2.5" opacity="0.75"/>
  <line x1="102" y1="0" x2="102" y2="1000" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>

  <!-- Right Ornate Side Border -->
  <rect x="885" y="0" width="115" height="1000" fill="url(#glowGiriRight)"/>
  <rect x="905" y="0" width="95" height="1000" fill="url(#patGirih)"/>
  <line x1="905" y1="0" x2="905" y2="1000" stroke="#fbbf24" stroke-width="2.5" opacity="0.75"/>
  <line x1="898" y1="0" x2="898" y2="1000" stroke="#10b981" stroke-width="1.2" opacity="0.5"/>
</svg>